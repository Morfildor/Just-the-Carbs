name: CI

# Compile, test and lint on every push and pull request (§64).
#
# The `build` and `instrumented` jobs validate the debug configuration only and deliberately do NOT
# sign anything — no keystore, password or upload key is referenced there, and none may be added to
# the repository (§53). The `release` job below is the one blocking, minified-configuration gate: it
# builds and R8-shrinks the actual release variant, so a keep-rule regression (like the one that
# quietly broke every kotlinx.serialization/Retrofit/Room/enum ProGuard rule in the 2026-08-14
# rebrand — see CLAUDE.md's "Post-rebrand hardening pass") fails CI instead of shipping unnoticed.
# It signs with a throwaway key generated fresh in the job and discarded when the runner is torn
# down; production signing credentials never touch CI.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests, lint, debug build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Belt and braces: this repo is developed on Windows, where git can drop the executable
      # bit on gradlew. The bit is set in the index; this stops a future rewrite silently
      # breaking CI with "Permission denied".
      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      # AndroidX requires compiling against API 37, which is newer than the runner image
      # ships with. See CLAUDE.md — targetSdk stays at the Play-mandated 36.
      #
      # sdkmanager is NOT on PATH on the hosted runners; only platform-tools is. It has to be
      # invoked through ANDROID_SDK_ROOT, or the step fails with "command not found".
      - name: Install Android SDK platform 37
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"

      # The safety-critical layer. Runs first so a calculation regression fails fast.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: just-the-carbs-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # API 26/29 run the focused database suite as blocking compatibility checks.
  # The full API 36 suite remains non-blocking on ordinary
  # pushes and pull requests: a device hiccup should not block a change to
  # the unit-tested logic, which is where the calculation safety actually lives.
  #
  # This is NOT the release gate. `release-gate.yml` runs the same suite with no continue-on-error
  # at all, and it is what must be green before an artifact is considered uploadable. The claim that
  # a passing release gate means the instrumented suite passed is true there and only there —
  # this job's tolerance is deliberately confined to day-to-day branch work.
  instrumented:
    name: Instrumented tests [API ${{ matrix.api }}]
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.api == 36 }}
    strategy:
      fail-fast: false
      matrix:
        api: [26, 29, 36]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Belt and braces: this repo is developed on Windows, where git can drop the executable
      # bit on gradlew. The bit is set in the index; this stops a future rewrite silently
      # breaking CI with "Permission denied".
      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Install Android SDK platform 37
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Excludes ExploratoryExperiment-tagged classes (P1 §11) — measurement/calibration harnesses
      # and rejected-approach evidence that assert little or nothing and were never meant to gate a
      # push. Some individually take minutes against the real ML Kit recognizer; running them here
      # bought nothing, since this job already tolerates failures and none of them were caught.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          script: >-
            ./gradlew :app:connectedDebugAndroidTest --no-daemon
            ${{ matrix.api == 36 && '-Pandroid.testInstrumentationRunnerArguments.notAnnotation=app.justthecarbs.ExploratoryExperiment' || '-Pandroid.testInstrumentationRunnerArguments.class=app.justthecarbs.data.local.PortionUsageDaoTest,app.justthecarbs.data.local.JustTheCarbsDatabaseMigrationTest' }}

  # The blocking release gate (§64 hardening pass). Builds the actual minified/shrunk release
  # configuration and fails the workflow if R8 fails, the APK is not produced, or any release-path
  # unit test fails. No continue-on-error anywhere in this job.
  release:
    name: Minified release build (blocking)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Install Android SDK platform 37
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"

      # A throwaway key generated fresh on the runner and never persisted anywhere. This is NOT the
      # production signing key (§53) — it exists only so app/build.gradle.kts's fail-closed guard
      # (which refuses to assemble a release variant with no signing material at all) has something
      # to attach, letting this job exercise the real minified/shrunk build configuration.
      - name: Generate an ephemeral CI-only test keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/ci-release-test.jks" \
            -storepass "ci-test-only" \
            -keypass "ci-test-only" \
            -alias ci-test \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=CI Test Only, OU=CI, O=Just the Carbs, L=None, S=None, C=US"
          echo "JUSTTHECARBS_STORE_FILE=$RUNNER_TEMP/ci-release-test.jks" >> "$GITHUB_ENV"
          echo "JUSTTHECARBS_STORE_PASSWORD=ci-test-only" >> "$GITHUB_ENV"
          echo "JUSTTHECARBS_KEY_ALIAS=ci-test" >> "$GITHUB_ENV"
          echo "JUSTTHECARBS_KEY_PASSWORD=ci-test-only" >> "$GITHUB_ENV"

      # The JVM tests again here, not because they differ from the `build` job, but so this job is
      # self-contained and its pass/fail is not silently dependent on `build` having run first.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      # The actual minified/shrunk configuration — R8 keep-rule regressions like the stale
      # app.carbscan.** rules found in the 2026-08-15 hardening pass only show up here, never in a
      # debug build.
      - name: Assemble minified release
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify the release APK was produced
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Release APK not found at $APK — assembleRelease did not produce an artifact."
            exit 1
          fi
          echo "Release APK present: $APK ($(du -h "$APK" | cut -f1))"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: just-the-carbs-release-apk-ci-test-signed
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
