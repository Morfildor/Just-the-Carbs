name: CI

# Compile, test and lint on every push and pull request (§64).
#
# Deliberately does NOT sign anything. No keystore, password or upload key is
# referenced here, and none may be added to the repository (§53). Release signing is
# configured later through repository secrets, by the owner.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests, lint, debug build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # AndroidX requires compiling against API 37, which is newer than the runner image
      # ships with. See CLAUDE.md — targetSdk stays at the Play-mandated 36.
      - name: Install Android SDK platform 37
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      # The safety-critical layer. Runs first so a calculation regression fails fast.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: carbscan-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # Instrumented tests need an emulator, which is slow and flaky on shared runners.
  # Kept as a separate job so a device hiccup never blocks a pull request on the
  # unit-tested logic, which is where the calculation safety actually lives.
  instrumented:
    name: Instrumented tests (Room DAO)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon
