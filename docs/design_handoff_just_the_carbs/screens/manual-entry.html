<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@1">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>body{margin:0;background:#EAE6DD;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Space Grotesk',sans-serif}</style>
</head><body>
<div id="root"></div>
<script type="text/babel" src="./android-frame.jsx"></script>
<script type="text/babel">
const BLUE='#2F8FE0', BLUE_SOFT='#E4F1FC', ORANGE_SOFT='#FFEEDC', CREAM='#FFF6EE', INK='#181A1E', INK_MUTED='#6B6A72';

function Fit({children}){
  const [scale,setScale]=React.useState(1);
  React.useLayoutEffect(()=>{
    const fit=()=>setScale(Math.min((window.innerWidth-48)/412,(window.innerHeight-48)/892,1));
    fit(); window.addEventListener('resize',fit); return ()=>window.removeEventListener('resize',fit);
  },[]);
  return <div style={{width:412*scale,height:892*scale,overflow:'hidden'}}>
    <div style={{width:412,height:892,transform:`scale(${scale})`,transformOrigin:'top left'}}>{children}</div>
  </div>;
}

function Field({label,value,onChange,suffix,placeholder}){
  return <label style={{display:'block'}}>
    <div style={{fontSize:12,fontWeight:600,color:INK_MUTED,marginBottom:6,fontFamily:'Space Grotesk'}}>{label}</div>
    <div style={{display:'flex',alignItems:'center',borderRadius:16,background:'#fff',boxShadow:'0 4px 14px rgba(24,26,30,0.05)',padding:'0 16px',height:56}}>
      <input value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={{flex:1,border:'none',outline:'none',fontFamily:'Roboto',fontSize:16,color:INK,background:'none'}}/>
      {suffix && <span style={{color:INK_MUTED,fontFamily:'Roboto',fontSize:14}}>{suffix}</span>}
    </div>
  </label>;
}

function ManualEntry(){
  const [name,setName]=React.useState('');
  const [carbs,setCarbs]=React.useState('');
  const [basis,setBasis]=React.useState('g');
  const ready = name && carbs;
  return (
    <div style={{position:'relative',height:'100%',display:'flex',flexDirection:'column',background:CREAM,fontFamily:'Space Grotesk',overflow:'hidden'}}>
      <div style={{position:'absolute',top:-90,left:-80,width:200,height:200,borderRadius:'50%',background:ORANGE_SOFT,opacity:0.9}}/>
      <div style={{display:'flex',alignItems:'center',padding:'14px 16px 4px',position:'relative',zIndex:1}}>
        <button style={{width:44,height:44,borderRadius:'50%',border:'none',background:'rgba(24,26,30,0.06)',display:'flex',alignItems:'center',justifyContent:'center'}}>
          <span className="material-symbols-outlined" style={{fontSize:22,color:INK}}>arrow_back</span>
        </button>
        <div style={{fontSize:20,fontWeight:700,color:INK,padding:'0 10px'}}>Enter product</div>
      </div>
      <div style={{flex:1,overflow:'auto',padding:'14px 20px',display:'flex',flexDirection:'column',gap:18,position:'relative',zIndex:1}}>
        <Field label="Product name" value={name} onChange={setName} placeholder="e.g. Volkoren brood"/>
        <Field label="Carbohydrates" value={carbs} onChange={setCarbs} placeholder="0" suffix={basis==='g'?'g / 100g':'g / 100ml'}/>
        <div>
          <div style={{fontSize:12,fontWeight:600,color:INK_MUTED,marginBottom:8}}>Measured per</div>
          <div style={{display:'flex',gap:8}}>
            {[['g','100 g'],['ml','100 ml']].map(([v,l])=>(
              <button key={v} onClick={()=>setBasis(v)} style={{height:44,padding:'0 18px',borderRadius:999,border:'none',
                background:basis===v?BLUE:'#fff',color:basis===v?'#fff':INK,fontFamily:'Space Grotesk',fontWeight:600,fontSize:14,cursor:'pointer',
                boxShadow:basis===v?'none':'0 4px 14px rgba(24,26,30,0.05)'}}>{l}</button>
            ))}
          </div>
        </div>
        <Field label="Package size (optional)" value="" onChange={()=>{}} placeholder="e.g. 500 g"/>
      </div>
      <div style={{padding:'12px 20px 28px',position:'relative',zIndex:1}}>
        <button disabled={!ready} style={{width:'100%',height:58,borderRadius:18,border:'none',background:ready?BLUE:'#DCE8F5',color:'#fff',fontFamily:'Space Grotesk',fontSize:16,fontWeight:700,cursor:ready?'pointer':'default'}}>Save product</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <Fit><window.AndroidDevice width={412} height={892}><ManualEntry/></window.AndroidDevice></Fit>
);
</script>
</body></html>
