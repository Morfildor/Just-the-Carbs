<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@1">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>body{margin:0;background:#EAE6DD;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Space Grotesk',sans-serif}</style>
</head><body>
<div id="root"></div>
<script type="text/babel" src="./android-frame.jsx"></script>
<script type="text/babel">
const BLUE='#2F8FE0', BLUE_SOFT='#E4F1FC', ORANGE='#FFA94D', CREAM='#FFF6EE', INK='#181A1E', INK_MUTED='#6B6A72';

function Fit({children}){
  const [scale,setScale]=React.useState(1);
  React.useLayoutEffect(()=>{
    const fit=()=>setScale(Math.min((window.innerWidth-48)/412,(window.innerHeight-48)/892,1));
    fit(); window.addEventListener('resize',fit); return ()=>window.removeEventListener('resize',fit);
  },[]);
  return <div style={{width:412*scale,height:892*scale,overflow:'hidden'}}>
    <div style={{width:412,height:892,transform:`scale(${scale})`,transformOrigin:'top left'}}>{children}</div>
  </div>;
}

const RECENTS=[
  {n:'Volkoren brood',s:'2 slices → 29.7g',fav:true,m:'VB'},
  {n:'Halfvolle melk',s:'250ml → 12.0g',fav:false,m:'HM'},
  {n:'Hagelslag puur',s:'20g → 15.4g',fav:false,m:'HP'},
];

function Home(){
  return (
    <div style={{position:'relative',height:'100%',display:'flex',flexDirection:'column',background:CREAM,fontFamily:'Space Grotesk',overflow:'hidden'}}>
      <div style={{position:'absolute',top:-90,right:-80,width:220,height:220,borderRadius:'50%',background:BLUE_SOFT,opacity:0.7}}/>
      <div style={{display:'flex',alignItems:'center',padding:'18px 20px 6px',position:'relative',zIndex:1}}>
        <div style={{flex:1,fontSize:24,fontWeight:700,color:INK,letterSpacing:'-0.5px'}}>Just the Carbs</div>
        <button aria-label="Settings" style={{width:44,height:44,borderRadius:'50%',border:'none',background:'rgba(24,26,30,0.06)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>
          <span className="material-symbols-outlined" style={{fontSize:22,color:INK}}>settings</span>
        </button>
      </div>

      <div style={{margin:'8px 20px 4px',padding:'12px 16px',borderRadius:18,background:BLUE_SOFT,display:'flex',alignItems:'center',cursor:'pointer',position:'relative',zIndex:1}}>
        <span style={{flex:1,fontSize:14,fontWeight:600,color:BLUE,fontFamily:'Space Grotesk'}}>Meal · 2 items · 38.0g</span>
        <span className="material-symbols-outlined" style={{fontSize:20,color:BLUE}}>chevron_right</span>
      </div>

      <div style={{padding:'18px 20px 8px',fontSize:12,fontWeight:700,letterSpacing:'1.6px',color:INK_MUTED,textTransform:'uppercase',position:'relative',zIndex:1}}>Recent</div>
      <div style={{flex:1,overflow:'auto',padding:'0 20px',display:'flex',flexDirection:'column',gap:10,position:'relative',zIndex:1}}>
        {RECENTS.map(r=>(
          <div key={r.n} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 8px 10px 12px',borderRadius:18,background:'#fff',boxShadow:'0 4px 14px rgba(24,26,30,0.05)'}}>
            <div style={{width:52,height:52,borderRadius:14,background:BLUE_SOFT,color:BLUE,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:15,flexShrink:0}}>{r.m}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:15,fontWeight:600,color:INK,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{r.n}</div>
              <div style={{fontSize:13,color:INK_MUTED,fontFamily:'Roboto',marginTop:2}}>{r.s}</div>
            </div>
            <span className="material-symbols-outlined" style={{fontSize:22,color:r.fav?ORANGE:'#D8D5CF',fontVariationSettings:r.fav?"'FILL' 1":"'FILL' 0"}}>star</span>
          </div>
        ))}
      </div>

      <div style={{padding:'14px 20px 28px',display:'flex',flexDirection:'column',alignItems:'center',gap:6,position:'relative',zIndex:1}}>
        <button style={{width:'100%',height:60,borderRadius:18,border:'none',background:BLUE,color:'#fff',fontFamily:'Space Grotesk',fontSize:16,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',gap:8,cursor:'pointer',boxShadow:'0 8px 20px rgba(47,143,224,0.32)'}}>
          <span className="material-symbols-outlined">qr_code_scanner</span> Scan barcode
        </button>
        <button style={{background:'none',border:'none',color:BLUE,fontFamily:'Space Grotesk',fontSize:14.5,fontWeight:700,cursor:'pointer',padding:'10px'}}>Enter manually</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <Fit><window.AndroidDevice width={412} height={892}><Home/></window.AndroidDevice></Fit>
);
</script>
</body></html>
