<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@1">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>body{margin:0;background:#EAE6DD;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Space Grotesk',sans-serif}</style>
</head><body>
<div id="root"></div>
<script type="text/babel" src="./android-frame.jsx"></script>
<script type="text/babel">
const BLUE='#2F8FE0', ORANGE_SOFT='#FFEEDC', CREAM='#FFF6EE', INK='#181A1E', INK_MUTED='#6B6A72';

function Fit({children}){
  const [scale,setScale]=React.useState(1);
  React.useLayoutEffect(()=>{
    const fit=()=>setScale(Math.min((window.innerWidth-48)/412,(window.innerHeight-48)/892,1));
    fit(); window.addEventListener('resize',fit); return ()=>window.removeEventListener('resize',fit);
  },[]);
  return <div style={{width:412*scale,height:892*scale,overflow:'hidden'}}>
    <div style={{width:412,height:892,transform:`scale(${scale})`,transformOrigin:'top left'}}>{children}</div>
  </div>;
}

function Row({label,children}){
  return <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 4px'}}>
    <span style={{fontSize:15.5,color:INK,fontFamily:'Roboto'}}>{label}</span>
    {children}
  </div>;
}
function Switch({on,onClick}){
  return <span onClick={onClick} style={{width:46,height:27,borderRadius:999,background:on?BLUE:'#E4DFD3',position:'relative',cursor:'pointer',display:'inline-block'}}>
    <span style={{position:'absolute',top:3,left:on?22:3,width:21,height:21,borderRadius:'50%',background:'#fff',transition:'left 200ms cubic-bezier(.2,0,0,1)'}}/>
  </span>;
}
function SectionLabel({children}){
  return <div style={{fontSize:12,fontWeight:700,letterSpacing:'1.6px',color:INK_MUTED,textTransform:'uppercase',padding:'18px 4px 4px'}}>{children}</div>;
}
function ChoicePill({label,active,onClick}){
  return <button onClick={onClick} style={{height:44,padding:'0 16px',borderRadius:999,border:'none',
    background:active?BLUE:'#fff',color:active?'#fff':INK,fontFamily:'Space Grotesk',fontWeight:600,fontSize:13.5,cursor:'pointer',
    boxShadow:active?'none':'0 4px 14px rgba(24,26,30,0.05)'}}>{label}</button>;
}

function Settings(){
  const [theme,setTheme]=React.useState('System');
  const [haptics,setHaptics]=React.useState(true);
  return (
    <div style={{position:'relative',height:'100%',display:'flex',flexDirection:'column',background:CREAM,fontFamily:'Space Grotesk',overflow:'hidden'}}>
      <div style={{display:'flex',alignItems:'center',padding:'14px 16px 0'}}>
        <button style={{width:44,height:44,borderRadius:'50%',border:'none',background:'rgba(24,26,30,0.06)',display:'flex',alignItems:'center',justifyContent:'center'}}>
          <span className="material-symbols-outlined" style={{fontSize:22,color:INK}}>arrow_back</span>
        </button>
        <div style={{fontSize:20,fontWeight:700,color:INK,padding:'0 10px'}}>Settings</div>
      </div>
      <div style={{flex:1,overflow:'auto',padding:'0 20px 24px'}}>
        <SectionLabel>Appearance</SectionLabel>
        <div style={{display:'flex',gap:8}}>{['System','Light','Dark'].map(t=><ChoicePill key={t} label={t} active={theme===t} onClick={()=>setTheme(t)}/>)}</div>

        <SectionLabel>Interaction</SectionLabel>
        <Row label="Haptic feedback"><Switch on={haptics} onClick={()=>setHaptics(!haptics)}/></Row>

        <SectionLabel>Data</SectionLabel>
        <Row label="Clear recent history"><span className="material-symbols-outlined" style={{color:BLUE}}>chevron_right</span></Row>
        <Row label="Clear saved products"><span className="material-symbols-outlined" style={{color:BLUE}}>chevron_right</span></Row>

        <SectionLabel>About</SectionLabel>
        <div style={{fontSize:14,color:INK_MUTED,fontFamily:'Roboto',padding:'4px 4px 12px'}}>Version 1.0</div>
        <div style={{background:ORANGE_SOFT,borderRadius:18,padding:16,display:'flex',flexDirection:'column',gap:8}}>
          <div style={{fontSize:15,fontWeight:700,color:'#B5710B'}}>Important</div>
          <div style={{fontSize:13.5,color:'#7A4B0A',fontFamily:'Roboto',lineHeight:'1.5'}}>Just the Carbs calculates the carbohydrate content of a portion. It does not calculate insulin or any other medication, and it does not replace the information printed on the package.</div>
        </div>
        <div style={{fontSize:12,color:INK_MUTED,fontFamily:'Roboto',padding:'14px 4px 0'}}>Product data from Open Food Facts, used under the Open Database License (ODbL).</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <Fit><window.AndroidDevice width={412} height={892}><Settings/></window.AndroidDevice></Fit>
);
</script>
</body></html>
