<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@1">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>body{margin:0;background:#EAE6DD;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Space Grotesk',sans-serif}</style>
</head><body>
<div id="root"></div>
<script type="text/babel" src="./android-frame.jsx"></script>
<script type="text/babel">
const BLUE='#2F8FE0';

function Scanner(){
  return (
    <div style={{position:'relative',height:'100%',background:'#111014',fontFamily:'Space Grotesk',overflow:'hidden'}}>
      <div style={{position:'absolute',inset:0,background:'radial-gradient(circle at 50% 38%,#242231,#111014 70%)'}}/>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'16px 16px 0',position:'relative',zIndex:1}}>
        <button aria-label="Close scanner" style={{width:44,height:44,borderRadius:'50%',background:'rgba(255,255,255,0.12)',border:'none',display:'flex',alignItems:'center',justifyContent:'center'}}>
          <span className="material-symbols-outlined" style={{color:'#fff',fontSize:22}}>close</span>
        </button>
        <div style={{color:'#fff',fontSize:15,fontWeight:600,letterSpacing:'-0.2px'}}>Just the Carbs</div>
        <button aria-label="Flash" style={{width:44,height:44,borderRadius:'50%',background:'rgba(255,255,255,0.12)',border:'none',display:'flex',alignItems:'center',justifyContent:'center'}}>
          <span className="material-symbols-outlined" style={{color:'#fff',fontSize:22}}>bolt</span>
        </button>
      </div>

      <div style={{position:'absolute',top:'50%',left:'50%',transform:'translate(-50%,-56%)',width:280,height:180}}>
        {[['-3px','-3px',0,0,'0 22px 0 0'],['-3px','-3px',0,0,'0 0 0 22px'],].map(()=>null)}
        <svg width="280" height="180" viewBox="0 0 280 180" fill="none" style={{position:'absolute',inset:0}}>
          <rect x="4" y="4" width="272" height="172" rx="26" stroke={BLUE} strokeWidth="3" strokeDasharray="0" fill="rgba(47,143,224,0.08)"/>
          {[[4,4,0,1],[276,4,1,1],[4,176,0,0],[276,176,1,0]].map(([x,y,fx,fy],i)=>(
            <path key={i} d={`M${x+(fx?-22:22)},${y} h${fx?22:-22} v${fy?22:-22}`} stroke="#fff" strokeWidth="4" strokeLinecap="round" fill="none"/>
          ))}
        </svg>
        <div style={{position:'absolute',left:0,right:0,top:'50%',height:2,background:BLUE,boxShadow:`0 0 12px 2px ${BLUE}`,animation:'scanmove 1.8s ease-in-out infinite'}}/>
      </div>

      <div style={{position:'absolute',bottom:0,left:0,right:0,padding:'24px 28px 40px',display:'flex',flexDirection:'column',alignItems:'center',gap:18,zIndex:1}}>
        <div style={{color:'#fff',fontSize:16,fontWeight:500,textAlign:'center',opacity:0.9}}>Line up the barcode</div>
        <button style={{height:52,padding:'0 24px',borderRadius:16,border:'1px solid rgba(255,255,255,0.25)',background:'rgba(255,255,255,0.08)',color:'#fff',fontFamily:'Space Grotesk',fontSize:15,fontWeight:600,cursor:'pointer',display:'flex',alignItems:'center',gap:8}}>
          <span className="material-symbols-outlined" style={{fontSize:20}}>keyboard</span>
          Enter barcode manually
        </button>
      </div>
      <style>{`@keyframes scanmove{0%,100%{top:18%}50%{top:82%}}`}</style>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <window.AndroidDevice width={412} height={892}><Scanner/></window.AndroidDevice>
);
</script>
</body></html>
