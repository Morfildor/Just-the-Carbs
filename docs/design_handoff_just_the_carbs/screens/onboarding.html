<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>body{margin:0;background:#EAE6DD;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Space Grotesk',sans-serif}</style>
</head><body>
<div id="root"></div>
<script type="text/babel" src="./android-frame.jsx"></script>
<script type="text/babel">
const BLUE='#2F8FE0', RED='#FF5C5C', ORANGE='#FFA94D', CREAM='#FFF6EE', INK='#181A1E';

function Mark({size=56,color='#fff'}){
  // abstract mark: a rounded square sliced open to reveal the essential circle inside — "just the [core] carbs"
  return (
    <svg width={size} height={size} viewBox="0 0 64 64" fill="none">
      <rect x="4" y="4" width="56" height="56" rx="18" fill={color} opacity="0.16"/>
      <path d="M4 22 A18 18 0 0 1 22 4 H42 A18 18 0 0 1 60 22 V26 H4 Z" fill={color}/>
      <circle cx="32" cy="38" r="13" fill={color}/>
      <circle cx="32" cy="38" r="6" fill={CREAM}/>
    </svg>
  );
}

const SLIDES = [
  {bg:BLUE, fg:'#fff', accent:'rgba(255,255,255,0.14)', eyebrow:'STEP 1', title:'Scan it.', body:'Point your camera at any barcode. No searching, no typing a product name.'},
  {bg:CREAM, fg:INK, accent:'rgba(255,169,77,0.16)', eyebrow:'STEP 2', title:'Size the portion.', body:'Drag, type, or tap a preset. Grams, slices, whatever makes sense for the food.', accentColor:ORANGE},
  {bg:RED, fg:'#fff', accent:'rgba(255,255,255,0.14)', eyebrow:'STEP 3', title:'Get the number.', body:'Just the carbs. Nothing else on screen competes with it.'},
];

function Dots({count,active}){
  return <div style={{display:'flex',gap:8,justifyContent:'center'}}>
    {Array.from({length:count}).map((_,i)=>(
      <div key={i} style={{width:i===active?22:7,height:7,borderRadius:4,background:'currentColor',opacity:i===active?1:0.35,transition:'width 220ms cubic-bezier(.2,0,0,1)'}}/>
    ))}
  </div>;
}

function Onboarding(){
  const [i,setI]=React.useState(0);
  const s=SLIDES[i];
  const last=i===SLIDES.length-1;
  return (
    <div style={{position:'relative',height:'100%',display:'flex',flexDirection:'column',background:s.bg,color:s.fg,transition:'background 280ms cubic-bezier(.2,0,0,1),color 280ms'}}>
      <div style={{position:'absolute',top:-60,right:-60,width:220,height:220,borderRadius:'50%',background:s.accent}}/>
      <div style={{position:'absolute',bottom:60,left:-70,width:180,height:180,borderRadius:'50%',background:s.accent}}/>
      <div style={{display:'flex',justifyContent:'flex-end',padding:'20px 20px 0'}}>
        {!last && <button onClick={()=>setI(SLIDES.length-1)} style={{background:'none',border:'none',color:'inherit',opacity:0.65,fontFamily:'Space Grotesk',fontSize:15,fontWeight:500,cursor:'pointer'}}>Skip</button>}
      </div>
      <div style={{flex:1,display:'flex',flexDirection:'column',justifyContent:'center',padding:'0 32px',position:'relative',zIndex:1}}>
        <div style={{marginBottom:20}}><Mark color={s.accentColor||s.fg} size={64}/></div>
        <div style={{fontFamily:'Space Grotesk',fontSize:13,fontWeight:700,letterSpacing:'2.5px',opacity:0.7,marginBottom:10}}>{s.eyebrow}</div>
        <div style={{fontFamily:'Space Grotesk',fontSize:44,fontWeight:700,letterSpacing:'-1.5px',lineHeight:'1.05',marginBottom:16}}>{s.title}</div>
        <div style={{fontFamily:'Roboto',fontSize:17,lineHeight:'1.5',opacity:0.85,maxWidth:280}}>{s.body}</div>
      </div>
      <div style={{padding:'0 32px 40px',display:'flex',flexDirection:'column',gap:20,position:'relative',zIndex:1}}>
        <Dots count={SLIDES.length} active={i}/>
        <button onClick={()=>setI(Math.min(i+1,SLIDES.length-1))} style={{
          height:60,borderRadius:18,border:'none',cursor:'pointer',
          background:last?'#fff':(s.bg===CREAM?BLUE:'#fff'),
          color:last?RED:(s.bg===CREAM?'#fff':s.bg),
          fontFamily:'Space Grotesk',fontSize:17,fontWeight:700,letterSpacing:'-0.2px',
          display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
          {last?'Get started':'Next'}
          <span style={{fontSize:19}}>{last?'→':'›'}</span>
        </button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <window.AndroidDevice width={412} height={892}><Onboarding/></window.AndroidDevice>
);
</script>
</body></html>
